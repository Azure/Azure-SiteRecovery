name: Kernel search

on:
  pull_request:
    paths:
      - "MobilityAgent/AzureToAzure/SupportedKernels/**"
      - "MobilityAgent/OnPremiseToAzure/SupportedKernels/**"
      - "MobilityAgent/README.md"
      - "MobilityAgent/KernelModuleUpdates/README.md"
      - "scripts/build_kernel_index.py"
      - "site/kernel-search/**"
      - "tests/test_build_kernel_index.py"
      - "tests/kernel_search.test.mjs"
      - ".github/workflows/kernel-search.yml"
  push:
    branches: [main]
    paths:
      - "MobilityAgent/AzureToAzure/SupportedKernels/**"
      - "MobilityAgent/OnPremiseToAzure/SupportedKernels/**"
      - "MobilityAgent/README.md"
      - "MobilityAgent/KernelModuleUpdates/README.md"
      - "scripts/build_kernel_index.py"
      - "site/kernel-search/**"
      - "tests/test_build_kernel_index.py"
      - "tests/kernel_search.test.mjs"
      - ".github/workflows/kernel-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test manifest index and search
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py'
          node --test tests/kernel_search.test.mjs
      - name: Build static search
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python -B scripts/build_kernel_index.py \
            --output-dir "$RUNNER_TEMP/kernel-search" \
            --source-commit "$SOURCE_COMMIT" \
            --repository "$SOURCE_REPOSITORY"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/kernel-search

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy search
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
